name: Prebuild Libraries (Windows x64)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prebuild-libraries:
    name: Build & Package 34 Libraries (x64)
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Free Disk Space
        run: |
          echo Freeing runner disk space (Java, Go, Ruby, Android)...
          if exist "C:\hostedtoolcache\windows\Java" rd /s /q "C:\hostedtoolcache\windows\Java"
          if exist "C:\hostedtoolcache\windows\go" rd /s /q "C:\hostedtoolcache\windows\go"
          if exist "C:\hostedtoolcache\windows\Ruby" rd /s /q "C:\hostedtoolcache\windows\Ruby"
          if exist "C:\hostedtoolcache\windows\Android" rd /s /q "C:\hostedtoolcache\windows\Android"
          echo Disk cleanup finished.

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mkdir %userprofile%\TBuild\ThirdParty
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Setup Environment
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "fork@example.com"
          git config --global user.name "ForkBuilder"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: ThirdParty Cache
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-x64-third-party-${{ env.CACHE_KEY }}-rel
          restore-keys: ${{ runner.OS }}-x64-third-party-

      - name: Libraries Cache
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}-rel
          restore-keys: ${{ runner.OS }}-x64-libs-v3-

      - name: Qt Cache
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt6-v2-${{ env.CACHE_KEY }}-rel
          restore-keys: ${{ runner.OS }}-x64-qt6-

      - name: Compile All Libraries
        run: |
          del /f /q "%LibrariesPath%\cache_keys\tlottie" 2>nul || echo OK
          del /f /q "%LibrariesPath%\cache_keys\wallet-engine" 2>nul || echo OK
          del /f /q "%LibrariesPath%\cache_keys\tdesktop_rust" 2>nul || echo OK
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Clean intermediate object files
        shell: bash
        run: |
          rm -rf "$LibrariesPath/libjxl/tools" "$LibrariesPath/libjxl/third_party/brotli/research" 2>/dev/null || true
          find "$LibrariesPath" -xtype l -delete 2>/dev/null || true
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.cpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/src/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Compress Libraries Package
        run: |
          cd /d "%userprofile%\TBuild"
          7z a -mx=3 -snl -xr!benchmark "%GITHUB_WORKSPACE%\libraries-win64.zip" Libraries ThirdParty
          if %errorlevel% gtr 1 (
            echo 7-Zip encountered fatal error %errorlevel%
            exit /b %errorlevel%
          )
          if not exist "%GITHUB_WORKSPACE%\libraries-win64.zip" (
            echo ERROR: Archive was not created!
            exit /b 1
          )
          echo Archive libraries-win64.zip verified successfully!
          exit /b 0

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prebuilt-libs
          name: "Prebuilt Libraries (Windows x64)"
          body: "Precompiled third-party libraries (Qt6, WebRTC, FFmpeg, OpenSSL, etc.) for EcoGram."
          files: ${{ github.workspace }}/libraries-win64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
