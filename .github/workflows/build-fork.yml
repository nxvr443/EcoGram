name: Build EcoGram (Windows x64)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-windows:
    name: Build EcoGram (Release)
    runs-on: windows-latest

    env:
      BUILD_TYPE: Debug

    defaults:
      run:
        shell: cmd

    steps:
      - name: Free Disk Space
        run: |
          echo Freeing runner disk space (Java, Go, Ruby)...
          if exist "C:\hostedtoolcache\windows\Java" rd /s /q "C:\hostedtoolcache\windows\Java"
          if exist "C:\hostedtoolcache\windows\go" rd /s /q "C:\hostedtoolcache\windows\go"
          if exist "C:\hostedtoolcache\windows\Ruby" rd /s /q "C:\hostedtoolcache\windows\Ruby"
          echo Disk cleanup finished.

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mkdir %userprofile%\TBuild\ThirdParty
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Apply EcoGram Patches (VoIP Turbo & Release Polish)
        shell: bash
        run: |
          echo "Applying EcoGram VoIP Turbo optimizations to tgcalls..."
          python "$TBUILD/$REPO_NAME/Telegram/build/patches/voip_turbo.py"
          echo "Applying EcoGram Release polish patches..."
          python "$TBUILD/$REPO_NAME/Telegram/build/patches/release_polish.py"

      - name: Setup Environment
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Download & Extract Prebuilt Libraries
        shell: bash
        run: |
          echo "Fetching prebuilt libraries from GitHub Release..."
          curl.exe -L -o "$RUNNER_TEMP/libraries-win64.zip" "https://github.com/${{ github.repository }}/releases/download/prebuilt-libs/libraries-win64.zip" || gh release download prebuilt-libs --pattern "libraries-win64.zip" --repo ${{ github.repository }} --dir "$RUNNER_TEMP" || true
          if [ -f "$RUNNER_TEMP/libraries-win64.zip" ]; then
            echo "Unpacking prebuilt libraries package..."
            7z x "$RUNNER_TEMP/libraries-win64.zip" -o"$USERPROFILE/TBuild" -y
            rm -f "$RUNNER_TEMP/libraries-win64.zip"
            echo "Libraries unpacked successfully and zip archive deleted!"
          else
            echo "Prebuilt package not found in releases! Running prepare script fallback..."
            cd "$TBUILD/$REPO_NAME"
            cmd.exe /c "Telegram\\build\\prepare\\win.bat skip-release silent qt6"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Telegram Desktop
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} ^
          -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} ^
          -D CMAKE_CONFIGURATION_TYPES=%BUILD_TYPE% ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D CMAKE_CXX_FLAGS_DEBUG="/MTd /O2 /Ob2 /D_DEBUG /DQT_NO_DEBUG" ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config %BUILD_TYPE% --parallel

      - name: Package Release
        shell: bash
        run: |
          mkdir -p TelegramFork-x64
          EXE_PATH=$(find "$TBUILD/$REPO_NAME/out" -name "Telegram.exe" | head -n 1)
          if [ -z "$EXE_PATH" ]; then
            echo "ERROR: Telegram.exe not found!"
            find "$TBUILD/$REPO_NAME/out" -maxdepth 3
            exit 1
          fi
          echo "Found Telegram.exe at: $EXE_PATH"
          cp "$EXE_PATH" TelegramFork-x64/
          UPDATER_PATH=$(find "$TBUILD/$REPO_NAME/out" -name "Updater.exe" | head -n 1)
          if [ -n "$UPDATER_PATH" ]; then
            cp "$UPDATER_PATH" TelegramFork-x64/
          fi
          ls -lh TelegramFork-x64/

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: EcoGram-Windows-x64-Release
          path: TelegramFork-x64/
          retention-days: 14
