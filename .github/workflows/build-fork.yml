name: Build EcoGram (Windows x64)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-windows:
    name: Build EcoGram (${{ github.event.inputs.build_type || 'Release' }})
    runs-on: windows-latest

    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mkdir %userprofile%\TBuild\ThirdParty
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Setup Environment
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Download & Extract Prebuilt Libraries
        shell: bash
        run: |
          echo "Fetching prebuilt libraries from GitHub Release..."
          gh release download prebuilt-libs --pattern "libraries-win64.zip" --repo ${{ github.repository }} --dir "$RUNNER_TEMP" || true
          if [ -f "$RUNNER_TEMP/libraries-win64.zip" ]; then
            echo "Unpacking prebuilt libraries package..."
            7z x "$RUNNER_TEMP/libraries-win64.zip" -o"$USERPROFILE/TBuild" -y
            echo "Libraries unpacked successfully!"
          else
            echo "Prebuilt package not found in releases! Running prepare script fallback..."
            cd "$TBUILD/$REPO_NAME"
            cmd.exe /c "Telegram\\build\\prepare\\win.bat skip-release silent qt6"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Telegram Desktop
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=%BUILD_TYPE% ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config %BUILD_TYPE% --parallel

      - name: Package Release
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\%BUILD_TYPE%
          mkdir TelegramFork-x64
          copy %OUT%\Telegram.exe TelegramFork-x64\
          copy %OUT%\Updater.exe TelegramFork-x64\ || echo "No updater"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoGram-Windows-x64-${{ env.BUILD_TYPE }}
          path: TelegramFork-x64/
          retention-days: 14
